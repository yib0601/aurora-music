name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: false
        default: ''

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.0'

jobs:
  # ============ Windows (x64) ============
  build-windows-x64:
    name: Build Windows x64 (nsis)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps (skip native build scripts; electron-builder will rebuild)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          # 防止 node-gyp 尝试查找 Visual Studio（windows-latest 的 VS18 不被旧 node-gyp 识别）
          npm_config_build_from_source: 'false'

      - name: Build app (vite)
        # @aurora/app 依赖 workspace 包 @aurora/shared（types 指向 dist/），
        # 必须先构建 shared，否则 tsc 报 "Cannot find module '@aurora/shared'"
        run: pnpm --filter @aurora/shared build && pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          Remove-Item -Recurse -Force packages/desktop/app-dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse packages/app/dist packages/desktop/app-dist
        shell: pwsh

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build Windows installer (x64)
        # 命名走 packages/desktop/package.json 的 win.artifactName：
        # `-c.artifactName=...` 在这条 pwsh 链路上传不进去 —— PowerShell 把单引号
        # 原样拼进参数，electron-builder 收到 `.artifactName='Aurora-…-x64.${ext}'`
        # 后当成 --config 的文件路径去 open，直接 ENOENT 挂掉整个打包步骤
        # （实测 run 44453264861）。Windows 的 ${arch} 宏就展开成 x64 / arm64，
        # 与 macOS dmg 命名同源，不需要 CLI 覆盖。Linux 的 ${arch} 会变成
        # amd64 / aarch64，那边仍用 bash 下的 CLI 覆盖（见 build-linux-* job）。
        run: pnpm --filter @aurora/desktop exec electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exe architecture (x64)
        # 文件名带 -x64 不代表内容就是 x64：真正的架构由下载的 Electron 包与
        # better-sqlite3 的 rebuild 目标决定，这里读 PE 头直接断言。
        run: node scripts/verify-win-arch.cjs "packages/desktop/release/win-unpacked/Aurora-Music.exe" x64

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64-nsis
          path: packages/desktop/release/
          if-no-files-found: warn

  # ============ Windows (arm64) ============
  # Windows on ARM 用原生 arm64 runner：better-sqlite3 是原生模块，在 x64 上交叉
  # 编译需要 node-gyp 拉 arm64 headers 并让 MSVC 走 ARM64 工具链，失败面大。
  #
  # continue-on-error：这条腿依赖 runner 镜像里是否带 MSVC 的 ARM64 构建工具。
  # 失败时不能让整个 Release 一起挂（教训见 docs/desktop-packaging.md §5.2.1：
  # 一个腿失败 → create-release 被 skip → 整次发布没有产物）。continue-on-error
  # 的 job 结论仍是 success，所以它照样进 create-release 的 needs —— 保证发版时
  # 等它跑完（否则 download-artifact 可能抢跑、把 arm64 安装包漏在 Release 外），
  # 而它失败也不会挡发布；产物存在就并入。
  build-windows-arm64:
    name: Build Windows arm64 (nsis)
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps (skip native build scripts; electron-builder will rebuild)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          npm_config_build_from_source: 'false'

      - name: Build app (vite)
        run: pnpm --filter @aurora/shared build && pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          Remove-Item -Recurse -Force packages/desktop/app-dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse packages/app/dist packages/desktop/app-dist
        shell: pwsh

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build Windows installer (arm64)
        # 同 x64：命名由 package.json 的 win.artifactName 决定，CLI 覆盖在 pwsh 下会 ENOENT
        run: pnpm --filter @aurora/desktop exec electron-builder --win --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exe architecture (arm64)
        # 交叉/原生都可能出「名字对、架构错」的包，读 PE 头的 Machine 字段直接断言
        # （0xAA64 = arm64）。这条腿整体是 continue-on-error，但校验失败会带警告暴露出来。
        run: node scripts/verify-win-arch.cjs "packages/desktop/release/win-arm64-unpacked/Aurora-Music.exe" arm64

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: windows-arm64-nsis
          path: packages/desktop/release/
          if-no-files-found: warn

  # ============ Linux (x64) ============
  build-linux-x64:
    name: Build Linux x64 (AppImage/deb/rpm)
    runs-on: ubuntu-latest
    # 固定 glibc 基线：编译环境决定产物的符号下限。
    # AppImage 目录（appimage.github.io）在 ubuntu-22.04（glibc 2.35、libstdc++
    # 6.0.30）上逐个测试包，Debian 12 用户是 glibc 2.36。跑在 ubuntu-latest
    # （24.04）上时，原生模块会被编成需要 GLIBC_2.38 与 GLIBCXX_3.4.31，这些
    # 系统上 dlopen 直接失败（version `GLIBC_2.38' not found），主进程随之异常、
    # 界面起不来（目录 CI 报 error-glibc-too-new / error-no-window）。
    # better-sqlite3 v12.11.1 没有 Electron 43（ABI 148）的 prebuild，必然本地
    # 编译，所以容器基线就是兼容性下限；打包后由 scripts/check-linux-baseline.sh 把关。
    #
    # 编译器必须用 clang：Electron 43 的 V8 头文件写成
    #   class V8_DEPRECATED("...") V8_EXPORT Value {
    # 属性宏出现在类名之前，GCC 11/12 在这里直接报
    #   error: expected identifier before '__attribute__'
    # 编译不过；clang-15 正常，且链接的仍是 22.04 的 libstdc++（6.0.30），
    # 产物符号不超出基线。
    container:
      image: ubuntu:22.04
      # 容器默认继承宿主的 systemd-resolved stub（127.0.0.53），而该链路上
      # archive.ubuntu.com / security.ubuntu.com 会解析失败（2026-11-11 在
      # ubuntu-24.04 镜像 20261101.360 上实测：宿主 getent 直接 GETENT FAIL，
      # 容器内 apt-get update 报 Could not resolve，Linux 包因此打不出来）。
      # 实测固定公共 DNS 后同一容器 7s 拉完 49MB 索引，故显式覆盖。
      options: --dns 8.8.8.8 --dns 1.1.1.1
    env:
      CC: clang-15
      CXX: clang++-15
    steps:
      - name: Install build dependencies
        # 容器里先补齐工具链，再 checkout（基础镜像不含 git）
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential clang-15 \
            rpm cpio binutils xz-utils

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app (vite)
        # @aurora/app 依赖 workspace 包 @aurora/shared（types 指向 dist/），
        # 必须先构建 shared，否则 tsc 报 "Cannot find module '@aurora/shared'"
        run: pnpm --filter @aurora/shared build && pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          rm -rf packages/desktop/app-dist
          cp -r packages/app/dist packages/desktop/app-dist

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build Linux packages (x64)
        # artifactName 由这里覆盖：electron-builder 的 ${arch} 宏对 deb/rpm/AppImage
        # 展开成 amd64 / aarch64 / x86_64，与 macOS 的 -arm64 / -x64 命名不一致，
        # 渲染层更新逻辑（packages/app/src/services/update-asset.ts）按 -arm64 / -x64
        # 分辨架构，所以两种架构都用 CLI 覆盖成同一套名字。
        run: pnpm --filter @aurora/desktop exec electron-builder --linux --x64 --publish never -c.artifactName='Aurora-Music-${version}-x64.${ext}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify glibc baseline + arch (x64)
        # 产物里任何引用超过 GLIBC_2.35 / GLIBCXX_3.4.30 的库，都会让老系统
        # （含 AppImage 目录的测试机）在 dlopen 时失败，这里直接挡住发布。
        # EXPECTED_ARCH 同时断言主程序与 better-sqlite3 真的是 x86_64。
        env:
          EXPECTED_ARCH: x64
        run: |
          bash scripts/check-linux-baseline.sh \
            packages/desktop/release/*-x64.AppImage \
            packages/desktop/release/*-x64.deb \
            packages/desktop/release/*-x64.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-x64-packages
          path: |
            packages/desktop/release/*-x64.AppImage
            packages/desktop/release/*-x64.deb
            packages/desktop/release/*-x64.rpm

  # ============ Linux (arm64) ============
  # 原生 arm64 runner：better-sqlite3 必须在本机架构编译（与 macOS 双架构同一理由）。
  # 这里不用 container —— runner 本身是 Ubuntu 22.04 arm64（glibc 2.35），恰好就是
  # x64 侧容器锁定的同一条基线；另外 job 级 container 在 arm64 上对 JS action 支持
  # 有限，直接跑在 runner 上更稳。
  #
  # arm64 的打包工具链逐项确认过（electron-builder 26.15.3）：
  #   - app-builder-bin 自带 linux/arm64/app-builder
  #   - fpm 有 linux-arm64v8 版（toolsets/linux.js 按 process.arch 选包）
  #   - AppImage 走 legacy FUSE2 路径，工具集里含 linux-arm64/mksquashfs 与 runtime-arm64
  # 缺任何一项 electron-builder 会在打包一开始报 "AppImage tool ... not found"。
  build-linux-arm64:
    name: Build Linux arm64 (AppImage/deb/rpm)
    runs-on: ubuntu-22.04-arm
    env:
      CC: clang-15
      CXX: clang++-15
    steps:
      - name: Free disk space
        # 标准 arm64 runner 磁盘比 x64 小；Electron arm64 + node_modules + 三份包
        # （解包目录就 ~300MB）容易顶满，先清掉用不到的大目录。
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        # clang 必装：Electron 43 的 V8 头把 V8_DEPRECATED 属性宏放在类名之前，
        # GCC 11/12 直接编不过（见 x64 job 的同款注释）。
        # rpm/cpio/binutils 用于打包与基线检查；python3/make 给 node-gyp。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential clang-15 \
            rpm cpio binutils xz-utils

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app (vite)
        run: pnpm --filter @aurora/shared build && pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          rm -rf packages/desktop/app-dist
          cp -r packages/app/dist packages/desktop/app-dist

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build Linux packages (arm64)
        run: pnpm --filter @aurora/desktop exec electron-builder --linux --arm64 --publish never -c.artifactName='Aurora-Music-${version}-arm64.${ext}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify glibc baseline + arch (arm64)
        env:
          EXPECTED_ARCH: arm64
        run: |
          bash scripts/check-linux-baseline.sh \
            packages/desktop/release/*-arm64.AppImage \
            packages/desktop/release/*-arm64.deb \
            packages/desktop/release/*-arm64.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-arm64-packages
          path: |
            packages/desktop/release/*-arm64.AppImage
            packages/desktop/release/*-arm64.deb
            packages/desktop/release/*-arm64.rpm
          if-no-files-found: error

  # ============ Android ============
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 21
        # AGP 9.2 要求 JDK 17+，推荐 JDK 21；同时支持 Kotlin 1.9 编译
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platforms;android-34'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app (vite)
        # @aurora/app 依赖 workspace 包 @aurora/shared（types 指向 dist/），
        # 必须先构建 shared，否则 tsc 报 "Cannot find module '@aurora/shared'"
        run: pnpm --filter @aurora/shared build && pnpm --filter @aurora/app build

      - name: Sync app dist to mobile webDir
        run: |
          mkdir -p packages/mobile/dist
          cp -r packages/app/dist/* packages/mobile/dist/

      - name: Sync web assets and Capacitor config to Android project
        # android/ 工程已在仓库中（含自定义 MediaPlaybackService、
        # AndroidManifest 权限声明、Kotlin 配置），无需 cap add，
        # 但需要 cap sync（而非 cap copy）来同步 web 资源并重新生成
        # capacitor.settings.gradle 和 capacitor.build.gradle
        run: |
          cd packages/mobile
          npx cap sync android
        env:
          CAPACITOR_ANDROID_LICENSE_PROMPT: auto

      - name: Patch Capacitor libraries for AGP 9.x compatibility
        # AGP 9.x 移除了对 getDefaultProguardFile('proguard-android.txt') 的支持，
        # 但 Capacitor 6.x 各包仍使用旧文件名。本地 node_modules 已手动 patch，
        # CI 需要在 cap sync 后批量替换所有 Capacitor 包中的 proguard-android.txt。
        run: |
          find node_modules/.pnpm/@capacitor*/node_modules -name "build.gradle" \
            -exec sed -i "s|proguard-android\.txt|proguard-android-optimize.txt|g" {} \;
          find node_modules/.pnpm/@capacitor-community*/node_modules -name "build.gradle" \
            -exec sed -i "s|proguard-android\.txt|proguard-android-optimize.txt|g" {} \;
          echo "Patched files:"
          grep -rn "proguard-android" node_modules/.pnpm/@capacitor*/node_modules/@capacitor/*/android/build.gradle node_modules/.pnpm/@capacitor*/node_modules/@capacitor/*/capacitor/build.gradle node_modules/.pnpm/@capacitor-community*/node_modules/@capacitor-community/*/android/build.gradle 2>/dev/null | head -20

      - name: Make gradlew executable
        run: chmod +x packages/mobile/android/gradlew

      - name: Switch Gradle distribution to official source
        # 本地用腾讯云镜像加速，CI（境外）改回官方源更稳定
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|' \
            packages/mobile/android/gradle/wrapper/gradle-wrapper.properties
          cat packages/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Determine version (versionName / versionCode)
        # versionCode 必须随版本单调递增，否则 Android 不把新包当作升级。
        # 编码规则：major*10000 + minor*100 + patch（0.1.8 → 108）
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=$(grep '"version"' package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          fi
          CODE=$(echo "$V" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Android versionName=$V versionCode=$CODE"

      - name: Build APK (debug)
        run: |
          cd packages/mobile/android
          ./gradlew assembleDebug --no-daemon \
            -PauroraVersionName=${{ steps.ver.outputs.version }} \
            -PauroraVersionCode=${{ steps.ver.outputs.code }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify APK signature and version
        # 签名校验是发布前的硬闸门：APK 签名密钥一旦变化，已安装用户无法覆盖升级。
        # 历史上该问题静默复发过多次（CI 成功、用户安装失败），因此这里直接让构建失败。
        env:
          EXPECTED_NAME: ${{ steps.ver.outputs.version }}
          EXPECTED_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          APK=$(find packages/mobile/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          bash scripts/verify-apk-signature.sh "$APK"

          AAPT2=$(ls -1 "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "$APK" | head -1)
          echo "$BADGING"
          ACTUAL_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          ACTUAL_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          if [ "$ACTUAL_NAME" != "$EXPECTED_NAME" ] || [ "$ACTUAL_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::APK 版本号不符：期望 $EXPECTED_NAME($EXPECTED_CODE)，实际 $ACTUAL_NAME($ACTUAL_CODE)"
            exit 1
          fi
          echo "✅ versionName=$ACTUAL_NAME versionCode=$ACTUAL_CODE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk

  # ============ macOS (Apple Silicon) ============
  # 双架构各跑原生 runner：better-sqlite3 是原生模块，交叉编译（arm64 主机出 x64 包）
  # 需要 node-gyp 下载异构 headers 并让 clang 交叉链接，失败面大；原生 runner 直接本机编译。
  # 无 Apple 开发者证书，采用 ad-hoc 签名（identity: "-"）：未签名的 arm64 产物在
  # Apple Silicon 上会被内核拒绝执行，ad-hoc 签名后至少能启动，用户放行一次即可。
  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app (vite)
        # @aurora/app 依赖 workspace 包 @aurora/shared（types 指向 dist/），
        # 必须先构建 shared，否则 tsc 报 "Cannot find module '@aurora/shared'"
        run: pnpm --filter @aurora/shared build && pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          rm -rf packages/desktop/app-dist
          cp -r packages/app/dist packages/desktop/app-dist

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build DMG (arm64)
        run: pnpm --filter @aurora/desktop exec electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify DMG (arch / ad-hoc signature / native module)
        # 三个硬闸门：主程序架构、better-sqlite3 原生模块架构、ad-hoc 签名。
        # 任一不符都会在 Apple Silicon 上「双击无反应」，必须在发布前卡死。
        # 末尾的 ✅ 断言是第二道闸门：macOS 自带 bash 3.2 的 EXIT trap 会覆盖脚本退出码
        # （脚本内已改为显式 exit "${code}"，这里再兜一层，避免校验失败被静默吞掉）。
        env:
          EXPECTED_ARCH: arm64
        run: |
          set -euo pipefail
          OUT="$(bash scripts/verify-macos-dmg.sh "packages/desktop/release/"*.dmg 2>&1)"
          printf '%s\n' "${OUT}"
          case "${OUT}" in
            *"✅ macOS 产物校验通过"*) ;;
            *) echo "::error::校验脚本未跑完（缺少通过标记）"; exit 1 ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-arm64
          path: packages/desktop/release/*.dmg
          if-no-files-found: error

  # ============ macOS (Intel) ============
  build-macos-x64:
    name: Build macOS (Intel)
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app (vite)
        run: pnpm --filter @aurora/shared build && pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          rm -rf packages/desktop/app-dist
          cp -r packages/app/dist packages/desktop/app-dist

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build DMG (x64)
        run: pnpm --filter @aurora/desktop exec electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify DMG (arch / ad-hoc signature / native module)
        env:
          EXPECTED_ARCH: x86_64
        run: |
          set -euo pipefail
          OUT="$(bash scripts/verify-macos-dmg.sh "packages/desktop/release/"*.dmg 2>&1)"
          printf '%s\n' "${OUT}"
          case "${OUT}" in
            *"✅ macOS 产物校验通过"*) ;;
            *) echo "::error::校验脚本未跑完（缺少通过标记）"; exit 1 ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-x64
          path: packages/desktop/release/*.dmg
          if-no-files-found: error

  # ============ Release ============
  create-release:
    name: Create GitHub Release
    needs: [build-windows-x64, build-windows-arm64, build-linux-x64, build-linux-arm64, build-android, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # changelog 需要完整历史与全部 tag。默认浅克隆（fetch-depth: 1）既没有 HEAD^
          # 也拿不到历史 tag，会让 release notes 退化成只剩一条 bump 提交。
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            # fallback: read from package.json
            v=$(grep '"version"' package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
            echo "version=$v" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          set -uo pipefail
          RELEASE_VERSION="${{ steps.ver.outputs.version }}"
          # 上一个 tag：HEAD 是 bump 提交，HEAD^ 的最近 tag 即上一版；
          # 拿不到时按创建时间回退（两种情况都依赖上游 fetch-depth: 0）。
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "v$RELEASE_VERSION" ]; then
            PREV_TAG=$(git tag --sort=-creatordate --list 'v*' | grep -vx "v$RELEASE_VERSION" | head -1 || true)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            # 首次发布：列出最近 20 条提交
            RANGE="-20"
          fi
          # 过滤掉版本号提交本身，让「更新内容」只留真实改动
          CHANGELOG=$(git log --pretty=format:"- %s" $RANGE | grep -v '^- chore: bump version' | head -50 || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 本次发布仅包含版本号变更"
          fi
          # 转义换行符为 GitHub Actions 输出格式（多行变量需用 delimiter）
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          set -e
          mkdir -p release
          # Windows（只取带版本号的 NSIS 安装包，跳过 unpacked 的 Aurora-Music.exe 和 elevate.exe）
          # 文件名已按架构区分：Aurora-Music-<ver>-x64.exe / -arm64.exe
          for d in windows-x64-nsis windows-arm64-nsis; do
            find "release-artifacts/$d" -name "Aurora-Music-*.exe" -exec cp {} release/ \; 2>/dev/null || true
          done
          # Linux（x64 / arm64 各自一个 artifact，文件名带 -x64 / -arm64）
          for d in linux-x64-packages linux-arm64-packages; do
            for ext in AppImage deb rpm; do
              find "release-artifacts/$d" -name "*.$ext" -exec cp {} release/ \; 2>/dev/null || true
            done
          done
          # macOS（双架构 dmg，文件名已带 -arm64 / -x64）
          find release-artifacts/macos-arm64 -name "*.dmg" -exec cp {} release/ \; 2>/dev/null || true
          find release-artifacts/macos-x64 -name "*.dmg" -exec cp {} release/ \; 2>/dev/null || true
          # Android — 重命名为 Aurora-Music-{version}-android.apk
          APK_SRC=$(find release-artifacts/android-apk -name "*.apk" | head -1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" "release/Aurora-Music-${{ steps.ver.outputs.version }}-android.apk"
          fi
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aurora Music v${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          files: release/*
          body: |
            ## Aurora Music v${{ steps.ver.outputs.version }}

            ### 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ### 下载

            | 平台 | 文件 | 安装 |
            | --- | --- | --- |
            | Windows (x64) | `Aurora-Music-${{ steps.ver.outputs.version }}-x64.exe` | NSIS 安装包，双击安装 |
            | Windows (ARM64) | `Aurora-Music-${{ steps.ver.outputs.version }}-arm64.exe` | 骁龙 X 等 ARM 设备；x64 机器请用上面那个 |
            | Linux x64 (AppImage) | `Aurora-Music-${{ steps.ver.outputs.version }}-x64.AppImage` | 便携免安装，`chmod +x` 后直接运行 |
            | Linux x64 (deb / rpm) | `Aurora-Music-${{ steps.ver.outputs.version }}-x64.deb` / `.rpm` | `sudo dpkg -i` / `sudo rpm -Uvh` |
            | Linux ARM64 (AppImage) | `Aurora-Music-${{ steps.ver.outputs.version }}-arm64.AppImage` | 树莓派 4/5、ARM 笔记本与服务器；`chmod +x` 后直接运行 |
            | Linux ARM64 (deb / rpm) | `Aurora-Music-${{ steps.ver.outputs.version }}-arm64.deb` / `.rpm` | 同上，装系统包更省事 |
            | macOS (Apple Silicon) | `Aurora-Music-${{ steps.ver.outputs.version }}-arm64.dmg` | M 系列芯片，打开 dmg 拖入「应用程序」 |
            | macOS (Intel) | `Aurora-Music-${{ steps.ver.outputs.version }}-x64.dmg` | Intel 芯片，打开 dmg 拖入「应用程序」 |
            | Android | `Aurora-Music-${{ steps.ver.outputs.version }}-android.apk` | 允许「未知来源」后安装；签名固定，可直接覆盖升级 |

            ### 首次使用

            安装后点「添加目录」选音乐文件夹即可建库；在线播放 / 歌词 / 歌单导入需先在「设置 → 在线源」配好自己的音源（应用不内置**可播放**的音源）。只配了洛雪取址脚本也行：搜索由内置「聚合搜索」兜底（查 QQ / 酷我 / 网易云 / 酷狗 / 咪咕，可停用），播放地址由脚本在播放时现取。

            - **macOS**：未经 Apple 公证（ad-hoc 签名），首次打开若被 Gatekeeper 拦截，执行 `xattr -cr /Applications/Aurora-Music.app`，或在「系统设置 → 隐私与安全性」点「仍要打开」；装错芯片架构会提示「已损坏」，Apple Silicon 用 `-arm64`、Intel 用 `-x64`。
            - **Android**：先在系统设置允许「未知来源」，再安装 APK。
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

