name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: false
        default: ''

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  # ============ Windows ============
  build-windows:
    name: Build Windows (nsis)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install deps (skip native build scripts; electron-builder will rebuild)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          # 防止 node-gyp 尝试查找 Visual Studio（windows-latest 的 VS18 不被旧 node-gyp 识别）
          npm_config_build_from_source: 'false'

      - name: Build app (vite)
        run: pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          Remove-Item -Recurse -Force packages/desktop/app-dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse packages/app/dist packages/desktop/app-dist
        shell: pwsh

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build Windows installer
        run: pnpm --filter @aurora/desktop exec electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: packages/desktop/release/
          if-no-files-found: error

  # ============ Linux ============
  build-linux:
    name: Build Linux (AppImage/deb/rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app (vite)
        run: pnpm --filter @aurora/app build

      - name: Sync app dist to desktop
        run: |
          rm -rf packages/desktop/app-dist
          cp -r packages/app/dist packages/desktop/app-dist

      - name: Compile Electron main (tsc)
        run: pnpm --filter @aurora/desktop exec tsc -p tsconfig.electron.json

      - name: Build Linux packages
        run: pnpm --filter @aurora/desktop exec electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.rpm

  # ============ Android ============
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Java 21
        # AGP 9.2 要求 JDK 17+，推荐 JDK 21；同时支持 Kotlin 1.9 编译
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platforms;android-34'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app (vite)
        run: pnpm --filter @aurora/app build

      - name: Sync app dist to mobile webDir
        run: |
          mkdir -p packages/mobile/dist
          cp -r packages/app/dist/* packages/mobile/dist/

      - name: Sync web assets and Capacitor config to Android project
        # android/ 工程已在仓库中（含自定义 MediaPlaybackService、
        # AndroidManifest 权限声明、Kotlin 配置），无需 cap add，
        # 但需要 cap sync（而非 cap copy）来同步 web 资源并重新生成
        # capacitor.settings.gradle 和 capacitor.build.gradle
        run: |
          cd packages/mobile
          npx cap sync android
        env:
          CAPACITOR_ANDROID_LICENSE_PROMPT: auto

      - name: Patch @capacitor/android for AGP 9.x compatibility
        # AGP 9.x 移除了对 getDefaultProguardFile('proguard-android.txt') 的支持，
        # 但 @capacitor/android@6.2.1 仍使用旧文件名。本地 node_modules 已手动
        # patch，CI 需要在 cap sync 后同步打补丁。
        run: |
          find node_modules/.pnpm/@capacitor+android*/node_modules/@capacitor/android/capacitor/build.gradle \
            -exec sed -i "s|proguard-android\.txt|proguard-android-optimize.txt|g" {} \;
          echo "Patched proguard file references:"
          grep -n "proguard" node_modules/.pnpm/@capacitor+android*/node_modules/@capacitor/android/capacitor/build.gradle

      - name: Install fixed debug keystore (signature stability across versions)
        # GitHub Actions 的 runner 每次都是新的，默认 ~/.android/debug.keystore 会被重新生成，
        # 导致不同版本的 APK 签名不一致，Android 拒绝覆盖安装。
        # 用仓库里固定的 debug.keystore 覆盖之，保证每次构建的 APK 签名一致可覆盖安装。
        # debug keystore 本身无安全价值（密码 android 是公开默认值），公开仓库可安全提交。
        run: |
          mkdir -p ~/.android
          cp packages/mobile/debug.keystore ~/.android/debug.keystore
          echo "已安装固定 debug keystore：" $(keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | head -5)

      - name: Make gradlew executable
        run: chmod +x packages/mobile/android/gradlew

      - name: Switch Gradle distribution to official source
        # 本地用腾讯云镜像加速，CI（境外）改回官方源更稳定
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|' \
            packages/mobile/android/gradle/wrapper/gradle-wrapper.properties
          cat packages/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK (debug)
        run: |
          cd packages/mobile/android
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk

  # ============ Release ============
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            # fallback: read from package.json
            v=$(grep '"version"' package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
            echo "version=$v" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag（排除当前 tag）
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            # 提取两个 tag 之间的提交记录，格式化为 changelog
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD | head -50)
          else
            echo "prev_tag=" >> $GITHUB_OUTPUT
            # 首次发布，列出最近 20 条提交
            CHANGELOG=$(git log --pretty=format:"- %s" -20)
          fi
          # 转义换行符为 GitHub Actions 输出格式（多行变量需用 delimiter）
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          set -e
          mkdir -p release
          # Windows（只取带版本号的 NSIS 安装包，跳过 unpacked 的 Aurora-Music.exe 和 elevate.exe）
          find release-artifacts/windows-nsis -name "Aurora-Music-*.exe" -exec cp {} release/ \; 2>/dev/null || true
          # Linux
          find release-artifacts/linux-packages -name "*.AppImage" -exec cp {} release/ \; 2>/dev/null || true
          find release-artifacts/linux-packages -name "*.deb" -exec cp {} release/ \; 2>/dev/null || true
          find release-artifacts/linux-packages -name "*.rpm" -exec cp {} release/ \; 2>/dev/null || true
          # Android — 重命名为 Aurora-Music-{version}-android.apk
          APK_SRC=$(find release-artifacts/android-apk -name "*.apk" | head -1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" "release/Aurora-Music-${{ steps.ver.outputs.version }}-android.apk"
          fi
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aurora Music v${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          files: release/*
          body: |
            ## Aurora Music v${{ steps.ver.outputs.version }}

            ### 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ### 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows | `Aurora-Music-${{ steps.ver.outputs.version }}.exe` | NSIS 安装包，双击安装 |
            | Linux (AppImage) | `Aurora-Music-${{ steps.ver.outputs.version }}.AppImage` | 便携版，`chmod +x` 后双击或 `./Aurora-Music-*.AppImage` 运行 |
            | Linux (deb) | `Aurora-Music-${{ steps.ver.outputs.version }}.deb` | Debian/Ubuntu 系，`sudo dpkg -i` 安装 |
            | Linux (rpm) | `Aurora-Music-${{ steps.ver.outputs.version }}.rpm` | Fedora/RHEL 系，`sudo rpm -Uvh` 安装 |
            | Android | `Aurora-Music-${{ steps.ver.outputs.version }}-android.apk` | 调试签名 APK，需在「设置 → 安全」允许未知来源后安装。使用固定 debug 签名，新版本可直接覆盖安装。 |

            ### 首次使用

            - **Windows**: 下载 `.exe` 安装包运行。
            - **Linux AppImage**: `chmod +x Aurora-Music-*.AppImage && ./Aurora-Music-*.AppImage`。
            - **Linux deb/rpm**: 用对应包管理器安装。
            - **Android**: 安装 APK 后，进入应用，点击「添加目录」在文件夹树中点选音乐目录。

            > Android 版本为调试签名 APK，安装时需手动允许「未知来源」。生产签名版本将在后续发布。
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
